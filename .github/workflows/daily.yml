name: Daily trading bot

on:
  schedule:
    # 21:15 UTC: 5:15 PM in New York in summer, 4:15 PM in winter, after the stock market closes.
    # GitHub may start scheduled runs a little late when it's busy.
    - cron: "15 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: no AI calls and no orders"
        type: boolean
        default: true

permissions:
  contents: write  # to save the day's signals, AI memory and log back to the repo

concurrency:
  group: daily-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      TRADINGAGENTS_LLM_PROVIDER: anthropic
      TRADINGAGENTS_DEEP_THINK_LLM: claude-opus-5-5
      TRADINGAGENTS_QUICK_THINK_LLM: claude-haiku-5-5
      TRADINGAGENTS_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install
        run: pip install -r requirements-cloud.txt

      - name: Daily run (prices, AI ratings, paper trades)
        run: python run_daily.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Show today's log
        if: always()
        run: cat "logs/daily_$(date -u +%F).log" || true

      - name: Save signals, AI memory and log
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add signals logs
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Daily run $(date -u +%F)"
          git pull --rebase
          git push
